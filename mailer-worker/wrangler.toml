name = "ts9designs-mailer"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
ALLOWED_ORIGINS = "https://www.ts9designs.com,https://ts9designs.com"
NOTIFY_EMAIL = "info@ts9designs.com"
FROM_EMAIL = "TS9Designs Website <notifications@ts9designs.com>"

# Secret (never in this file): set with
#   wrangler secret put RESEND_API_KEY

# Optional: create a KV namespace and uncomment to enable per-IP rate
# limiting (wrangler kv namespace create RATE_LIMIT_KV).
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "<namespace-id>"
