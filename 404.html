<!DOCTYPE html>
<html lang="en">
<head>
    <script src="assets/js/cookie-consent.js"></script>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - TS9 Designs</title>
    <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/favicon-16x16.png" sizes="16x16">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/site-header.css">
    <link rel="stylesheet" href="/assets/css/site-footer.css">
    <style>
        /* Modern Swiss Design System - Matching TS9 Designs */
        :root {
            --primary: #4da6e7;
            --gold: #d5a80f;
            --primary-dark: #1d4ed8;
            --dark: #1e293b;
            --light: #f8fafc;
            --white: #ffffff;
            --black: #0f172a;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --radius-md: 15px;
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;
            --spacing-3xl: 4rem;
            --transition: all 0.3s ease;
            --container-width: 1200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            color: var(--gray-800);
            line-height: 1.6;
            background: #ffffff;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 var(--spacing-lg);
        }

        /* 404 hero */
        .not-found-main {
            flex: 1;
            display: flex;
            align-items: center;
        }

        .not-found-section {
            padding: var(--spacing-3xl) 0;
            width: 100%;
        }

        .not-found-content {
            max-width: 640px;
            margin: 0 auto;
            text-align: center;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
            color: var(--primary-dark);
            letter-spacing: -2px;
            margin-bottom: var(--spacing-md);
        }

        .not-found-content h1 {
            font-size: 2rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: var(--spacing-md);
            letter-spacing: -0.5px;
        }

        .not-found-content p {
            font-size: 1.1rem;
            color: var(--gray-600);
            margin-bottom: var(--spacing-xl);
        }

        .not-found-actions {
            display: flex;
            gap: var(--spacing-md);
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: var(--spacing-2xl);
        }

        .btn-primary-404, .btn-outline-404 {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.85rem 1.6rem;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            transition: var(--transition);
        }

        .btn-primary-404 {
            background: var(--dark);
            color: var(--white);
            border: 1px solid var(--dark);
        }

        .btn-primary-404:hover {
            background: var(--gold);
            border-color: var(--gold);
            color: var(--dark);
        }

        .btn-outline-404 {
            background: transparent;
            color: var(--dark);
            border: 1px solid var(--gray-300);
        }

        .btn-outline-404:hover {
            border-color: var(--dark);
        }

        .helpful-links {
            border-top: 1px solid var(--gray-200);
            padding-top: var(--spacing-xl);
        }

        .helpful-links-label {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--gray-500);
            margin-bottom: var(--spacing-md);
        }

        .helpful-links-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem;
        }

        .helpful-link {
            display: inline-block;
            padding: 0.5rem 1rem;
            border: 1px solid var(--gray-200);
            border-radius: 999px;
            color: var(--gray-700);
            text-decoration: none;
            font-size: 0.86rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .helpful-link:hover {
            border-color: var(--primary-dark);
            color: var(--primary-dark);
        }

        @media (max-width: 600px) {
            .error-code { font-size: 4.5rem; }
            .not-found-content h1 { font-size: 1.5rem; }
            .not-found-content p { font-size: 1rem; }
        }

    </style>
</head>
<body>
    <div id="site-header-root"></div>
    <script src="/assets/js/load-header.js"></script>

    <main class="not-found-main">
        <section class="not-found-section">
            <div class="container">
                <div class="not-found-content">
                    <div class="error-code">404</div>
                    <h1>We couldn't find that page</h1>
                    <p>The page you're looking for may have been moved, renamed, or doesn't exist. Let's get you back on track.</p>

                    <div class="not-found-actions">
                        <a href="/" class="btn-primary-404">Back to Home</a>
                        <a href="/permit-estimate.html" class="btn-outline-404">Get an Estimate</a>
                    </div>

                    <div class="helpful-links">
                        <div class="helpful-links-label">Or try one of these</div>
                        <div class="helpful-links-grid">
                            <a href="/about.html" class="helpful-link">About Us</a>
                            <a href="/#portfolio" class="helpful-link">Our Work</a>
                            <a href="/residential.html" class="helpful-link">Residential Plans</a>
                            <a href="/commercial.html" class="helpful-link">Commercial Projects</a>
                            <a href="/case-studies/index.html" class="helpful-link">Case Studies</a>
                            <a href="/contact.html" class="helpful-link">Contact Us</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="site-footer-root"></div>
    <script src="/assets/js/load-footer.js"></script>
</body>
</html>
